# Tests for every package in the monorepo. Runs on PRs (including release-please's
# release PR - make these checks required on main to gate releases) and on pushes to
# main. All workflows live here at the repository root: GitHub Actions only reads
# the root .github/workflows/, so a workflow file under <pkg>/.github/ never runs.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: pytest-intent, module: pytest_intent }
          - { name: csd-intent, module: csd_intent }
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: ${{ matrix.package.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # csd-intent's tests attest their claims with @intent markers, so the
          # sibling pytest-intent runtime must be importable (self no-op for
          # the pytest-intent matrix entry).
          pip install -e ../pytest-intent
      - name: Lint (ruff)
        run: ruff check ${{ matrix.package.module }} tests
      - name: Type-check (mypy)
        run: mypy ${{ matrix.package.module }}
      - name: Run tests
        run: pytest tests/ -v

  csd-intent-self-audit:
    needs: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csd-intent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Self-audit (csd-intent on itself)
        run: csd-intent . --tests-dir tests --fail-on any

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [vitest-intent, playwright-intent, starlight-theme]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the in-repo vitest-intent file dependency
        if: matrix.package == 'starlight-theme'
        working-directory: vitest-intent
        run: |
          npm ci
          npm run build
      - run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Run tests
        run: npm test

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend install (with sibling pytest-intent for @intent markers)
        working-directory: playbook-studio/studio-backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e ../../pytest-intent
      - name: Backend lint (ruff)
        working-directory: playbook-studio/studio-backend
        run: ruff check .
      - name: Backend tests
        working-directory: playbook-studio/studio-backend
        run: pytest -q
      - name: Build the in-repo vitest-intent file dependency
        working-directory: vitest-intent
        run: |
          npm ci
          npm run build
      - name: Frontend install
        working-directory: playbook-studio/studio-frontend
        run: npm ci
      - name: Frontend tests
        working-directory: playbook-studio/studio-frontend
        run: npm test

  intent-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install csd-intent
        run: |
          python -m pip install --upgrade pip
          pip install -e csd-intent
      - name: Audit playbook-studio
        run: csd-intent playbook-studio --fail-on any
      - name: Audit starlight-theme
        run: csd-intent starlight-theme --fail-on any
