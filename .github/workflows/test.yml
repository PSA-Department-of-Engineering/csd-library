# Tests for every package in the monorepo. Runs on PRs (including release-please's
# release PR - make these checks required on main to gate releases) and on pushes to
# main. All workflows live here at the repository root: GitHub Actions only reads
# the root .github/workflows/, so a workflow file under <pkg>/.github/ never runs.
name: tests

on:
  push:
    branches: [main]
  # Manual re-trigger: a queued run once wedged at GitHub's dispatch layer
  # (stuck "queued" across two attempts while runners sat idle); dispatching a
  # fresh run is the reliable recovery.
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: arc-dind
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: pytest-intent, module: pytest_intent }
          - { name: csd-intent, module: csd_intent }
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: ${{ matrix.package.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # csd-intent's tests attest their claims with @intent markers, so the
          # sibling pytest-intent runtime must be importable (self no-op for
          # the pytest-intent matrix entry).
          pip install -e ../pytest-intent
      - name: Lint (ruff)
        run: ruff check ${{ matrix.package.module }} tests
      - name: Type-check (mypy)
        run: mypy ${{ matrix.package.module }}
      - name: Run tests
        run: pytest tests/ -v

  csd-intent-self-audit:
    needs: python
    runs-on: arc-dind
    defaults:
      run:
        working-directory: csd-intent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Self-audit (csd-intent on itself)
        run: csd-intent . --tests-dir tests --fail-on any

  node:
    runs-on: arc-dind
    strategy:
      fail-fast: false
      matrix:
        package: [vitest-intent, playwright-intent, starlight-theme]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the in-repo vitest-intent file dependency
        if: matrix.package == 'starlight-theme'
        working-directory: vitest-intent
        run: |
          npm ci
          npm run build
      - run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Run tests
        run: npm test

  intent-audits:
    runs-on: arc-dind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install csd-intent
        run: |
          python -m pip install --upgrade pip
          pip install -e csd-intent
      - name: Audit starlight-theme
        run: csd-intent starlight-theme --fail-on any

  # The theme catalog is a source asset, not a package, so it has no test suite of its
  # own - but it does have an invariant worth gating: a theme must be usable on its own.
  # The checker needs no dependencies (node builtins only), so this job installs nothing.
  themes:
    runs-on: arc-dind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check theme self-containment
        run: node slidev-themes/check-themes.mjs
