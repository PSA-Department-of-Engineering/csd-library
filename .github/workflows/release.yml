# csd-library release: a thin caller of the org's reusable library workflow. The
# release logic lives once in PSA-Department-of-Engineering/ci, so it cannot drift.
#
# On push to main, release-please maintains a per-package release PR (npm + Python)
# from Conventional Commits; merging that PR cuts the tag + GitHub release, publishes
# the npm packages to the public npm registry, and publishes the Python packages to
# PyPI (the publish-pypi job below). Day-to-day work still pushes straight to main -
# the only PR in the flow is release-please's bot-authored release PR. See
# docs/adr/0002-release-automation.md and docs/adr/0004-public-pypi-distribution.md.
name: release

on:
  push:
    branches: [main]
  # Recovery lever: re-drive release-please by hand when a push's run died before
  # it (e.g. the hygiene gate refusing a squash-merge's auto-added co-author
  # trailer). A merged release PR stays pending until a run cuts it; this cuts it
  # without inventing a commit.
  workflow_dispatch:
    inputs:
      publish-paths:
        description: >-
          Recovery only: JSON array of package dirs (e.g. ["csd-intent"]) to run the
          PyPI publish for at main's current versions. For a release whose tag was cut
          but whose upload died on CI plumbing. Not a republish path in the ADR-0003
          "burned release" sense: PyPI never accepts a filename twice and the job
          skips existing files, so this can only COMPLETE a stuck release, never
          reissue one.
        required: false
        default: ''

jobs:
  release:
    uses: PSA-Department-of-Engineering/ci/.github/workflows/library.yml@main
    # id-token: write is what lets the publish sign a provenance attestation. The
    # called workflow declares it, and a called workflow may request only a SUBSET of
    # its caller's grant - so dropping it here fails the run at creation, not at publish.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit

  # The one job that lives here rather than in the shared library.yml, out of
  # necessity: PyPI trusted publishing validates the OIDC token's job_workflow_ref
  # claim, and for a job inside a reusable workflow that claim names ci/library.yml -
  # never the release.yml this repo's PyPI publishers are registered against
  # (pypi/warehouse#11096). The steps are inline rather than a ci composite for an
  # upstream reason of their own: pypa/gh-action-pypi-publish derives its Docker
  # invocation from github.action_repository, which nested in a cross-repo composite
  # names the composite's repo and yields an invalid image reference. Fans out over
  # the packages release-please actually cut (or, on dispatch, over publish-paths -
  # see the input's description); npm directories are skipped here, mirroring the npm
  # job skipping Python ones.
  publish-pypi:
    needs: release
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.publish-paths != '') ||
      (needs.release.outputs.paths_released != '' && needs.release.outputs.paths_released != '[]')
    # GitHub-hosted for the same reason library.yml pins publish-npm there: publishing
    # a public artifact to a public registry has no business riding on homelab uptime.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token PyPI exchanges for a short-lived upload token
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.publish-paths || needs.release.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.path }}
        id: build
        run: |
          if [ -f "${{ matrix.path }}/pyproject.toml" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            cd "${{ matrix.path }}"
            pipx run build --sdist --wheel
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.path }} has no pyproject.toml (npm package); library.yml's npm job publishes it, nothing to do here."
          fi
      # No credential, deliberately: each PyPI project names this repo + release.yml
      # as a trusted publisher (pending publishers cover a first release), so PyPI
      # mints a short-lived token from the run's OIDC token and records PEP 740
      # provenance attestations from the same identity. skip-existing so a re-run of
      # a partially-failed fan-out does not die on the file that already landed.
      - name: Publish ${{ matrix.path }} to PyPI
        if: steps.build.outputs.python == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist
          skip-existing: true
          verbose: true
