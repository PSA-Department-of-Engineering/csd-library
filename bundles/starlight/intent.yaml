# Intent claims for the STARLIGHT bundle (CSD-INTENT-01 canonical schema).
#
# Validates content-collection conventions for any Starlight (Astro) docs site
# that uses the standard `src/content/docs/` layout.
#
# All IDs prefixed INT-STARLIGHT-NNN per REF-Intent-Bundle namespacing. The bundle's
# vitest impl (impls/vitest/starlight.test.ts) carries the `intent('INT-STARLIGHT-NNN', ...)`
# markers; csd-intent reconciles markers ↔ claims.

INT-STARLIGHT-001:
  version: 1.0.0
  status: active
  statement: "Every doc page MUST have a non-empty `title` frontmatter field."
  rationale: "Starlight uses title for nav, page heading, and OG metadata; missing title yields broken UI."
  test:
    scope: unit
    component: ContentCollection
    type: invariant
  criticality: critical

INT-STARLIGHT-002:
  version: 1.0.0
  status: active
  statement: "Every doc page MUST have a non-empty `id` frontmatter field."
  rationale: "Stable per-doc identifier for cross-linking and navigation; required by the content collection schema."
  test:
    scope: unit
    component: ContentCollection
    type: invariant
  criticality: critical

INT-STARLIGHT-003:
  version: 1.0.0
  status: active
  statement: "Doc page `id` values MUST be unique across the entire docs collection."
  rationale: "Duplicate IDs break cross-link resolution and content-collection queries."
  test:
    scope: integration
    component: ContentCollection
    type: invariant
  criticality: critical

INT-STARLIGHT-004:
  version: 1.0.0
  status: active
  statement: "Every doc page MUST have a `type` frontmatter field with value in {Overview, Guide, Standard, Reference}."
  rationale: "Type drives nav grouping and template selection; unknown values produce orphan pages."
  test:
    scope: unit
    component: ContentCollection
    type: contract
  criticality: high

INT-STARLIGHT-005:
  version: 1.0.0
  status: active
  statement: "Every doc page MUST have a `status` frontmatter field with value in {Draft, Active, Deprecated}."
  rationale: "Status drives visibility filters and review queues."
  test:
    scope: unit
    component: ContentCollection
    type: contract
  criticality: high

INT-STARLIGHT-006:
  version: 1.0.0
  status: active
  statement: "Every doc page MUST have an `updated` frontmatter field formatted as YYYY-MM-DD."
  rationale: "Drives staleness detection and 'last updated' display in the rendered site."
  test:
    scope: unit
    component: ContentCollection
    type: contract
  criticality: high
