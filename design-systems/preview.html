op:26px}<\/style><style>/* Authored theme. The :root palette is maintained by design-systems/generate.py. */\n@font-face{font-family:\"Vodafone\";font-weight:300;font-display:swap;src:url(\"/fonts/Vodafone-300.woff2\") format(\"woff2\")}\n@font-face{font-family:\"Vodafone\";font-weight:400;font-display:swap;src:url(\"/fonts/Vodafone-400.woff2\") format(\"woff2\")}\n@font-face{font-family:\"Vodafone\";font-weight:500;font-display:swap;src:url(\"/fonts/Vodafone-500.woff2\") format(\"woff2\")}\n@font-face{font-family:\"Vodafone\";font-weight:600;font-display:swap;src:url(\"/fonts/Vodafone-600.woff2\") format(\"woff2\")}\n@font-face{font-family:\"Vodafone\";font-weight:700;font-display:swap;src:url(\"/fonts/Vodafone-700.woff2\") format(\"woff2\")}\n@font-face{font-family:\"Vodafone\";font-weight:800;font-display:swap;src:url(\"/fonts/Vodafone-800.woff2\") format(\"woff2\")}\n:root{color-scheme:light;--ds-canvas:#f2f2f2;--ds-surface:#ffffff;--ds-raised:#f2f2f2;--ds-ink:#25282b;--ds-muted:#4a4d4e;--ds-line:#bebebe;--ds-action-ink:#ffffff;--ds-link:#e60000;--ds-good:#226547;--ds-warn:#795100;--ds-bad:#ad2838;--ds-focus:#00798c;--ds-sans:\"Vodafone\", -apple-system, \"SF Pro Display\", \"Helvetica Neue\", \"Segoe UI\", Arial, sans-serif;--ds-mono:ui-monospace, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;--ds-radius:10px;--ds-brand:#e60000;}\n/* Shared roles for slides and reading instruments. Content stays still. */\n#slidev-goto-dialog:has(#slidev-goto-input:disabled){display:none!important}\n.slidev-slide-content,.print-slide-container{background:var(--ds-canvas)!important;color:var(--ds-ink);isolation:isolate}\n.print-slide-container{position:relative!important;overflow:hidden}\n.slidev-layout{background:transparent!important;color:var(--ds-ink);font-family:var(--ds-sans);padding:100px 58px 44px!important;font-size:19px}\n.slidev-layout h1{font-size:42px;font-weight:500;line-height:1.12;letter-spacing:-.04em;color:var(--ds-ink);margin-bottom:24px}\n.slidev-layout h2{font-size:27px;color:var(--ds-ink)}\n.slidev-layout p,.slidev-layout li{line-height:1.5}\n.ds-cover h1{font-size:65px;max-width:700px;line-height:1.04;letter-spacing:-.05em;margin:38px 0 24px}\n.ds-eyebrow{font:11px var(--ds-mono);text-transform:uppercase;letter-spacing:.18em;color:var(--ds-link);margin-bottom:16px}\n.ds-lede{font-size:23px;max-width:650px;line-height:1.45;color:var(--ds-muted)}\n.ds-note{font:12px var(--ds-mono);color:var(--ds-muted);margin-top:22px}\n.ds-grid-two{display:grid;grid-template-columns:1fr 1fr;gap:22px}\n.ds-flow{display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr;gap:12px;align-items:center}.ds-arrow{font-size:24px;color:var(--ds-link)}\n.ds-card{background:color-mix(in srgb,var(--ds-surface) 66%,transparent);backdrop-filter:blur(18px);border:1px solid var(--ds-line);border-radius:var(--ds-radius);padding:24px}\n.ds-solid .ds-card{background:var(--ds-surface);backdrop-filter:none}\n.ds-card h2{margin:0 0 14px}.ds-card p{font-size:18px;margin:0;color:var(--ds-muted)}\n.ds-rule{height:2px;width:54px;background:var(--ds-brand);margin:18px 0 24px}\n.ds-stat{font-size:64px;line-height:1.2;letter-spacing:-.05em;color:var(--ds-link)}\n.ds-list{display:grid;gap:16px;padding-left:24px}.ds-list li::marker{color:var(--ds-link)}\n.ds-brand{position:absolute;top:29px;left:58px;display:flex;align-items:center;gap:13px;color:var(--ds-ink);z-index:3;pointer-events:none;font-family:var(--ds-sans)}\n.ds-wordmark{font:700 37px/1 var(--ds-sans);letter-spacing:-.075em}.ds-dot{color:var(--ds-brand)}\n.ds-logo{width:128px;height:auto}.ds-unit{border-left:1px solid var(--ds-line);padding-left:13px;font-size:16px;font-weight:500}\n.ds-speechmark{width:37px;height:37px;display:block}.ds-lockup-text{font-size:17px;line-height:1.1;border-left:1px solid var(--ds-line);padding-left:13px}.ds-lockup-text small{display:block;font:8px var(--ds-mono);letter-spacing:.14em;margin-top:6px}.ds-flag{width:22px;height:auto}\n.ds-ambient{position:absolute;in <script>
const previews=JSON.parse(document.getElementById('previews').textContent);
const identity=document.getElementById('identity'),frame=document.getElementById('preview');
const controls=['light','solid','motion'].map(id=>document.getElementById(id));
function render(){let key=identity.value+(controls[0].getAttribute('aria-pressed')==='true'?'-light':'');let html=previews[key];const extra=(controls[1].getAttribute('aria-pressed')==='true'?' ds-solid':'')+(controls[2].getAttribute('aria-pressed')==='false'?' ds-motion-off':'');frame.srcdoc=html.replace('class="slidev-slide-content"','class="slidev-slide-content'+extra+'"');}
controls.forEach(button=>button.onclick=()=>{button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')!=='true');render()});identity.onchange=render;render();
</script></body></html>
