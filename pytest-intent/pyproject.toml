[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-intent"
version = "0.2.0"
description = "The @intent decorator for pytest — links a test function to one or more CSD intent claims (INT-NNN). Spec validation and cross-runtime coverage live in the standalone `csd-intent` CLI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rafael Pires"},
]
keywords = ["pytest", "intent", "csd", "testing", "specification", "tdd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/PSA-Department-of-Engineering/csd-library/tree/main/pytest-intent"
Documentation = "https://github.com/PSA-Department-of-Engineering/csd-library/tree/main/pytest-intent#readme"
Repository = "https://github.com/PSA-Department-of-Engineering/csd-library"
Issues = "https://github.com/PSA-Department-of-Engineering/csd-library/issues"
"CSD methodology" = "https://github.com/PSA-Department-of-Engineering/cognitive-software-delivery"
"csd-intent (audit CLI)" = "https://github.com/PSA-Department-of-Engineering/csd-library/tree/main/csd-intent"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_intent*"]
exclude = ["tests*", "examples*"]
