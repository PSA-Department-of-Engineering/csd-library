# Intent claims for csd-intent itself: the auditor dogfoods the CSD-INTENT-01 spec
# it enforces. CI runs `csd-intent . --fail-on any`, so this file is held to the
# same gate csd-intent applies in every other project: valid schema, no orphan
# markers, and every active claim attested by an @intent marker in tests/.

INT-CSD-001:
  version: 1.0.0
  status: active
  statement: "intent.yaml is validated against CSD-INTENT-01: required fields, enum values, semver version, and the INT-* id pattern."
  rationale: "Schema validity is the foundation; every other check assumes well-formed claims."
  test:
    scope: unit
    component: SchemaValidator
    type: contract
  criticality: critical

INT-CSD-002:
  version: 1.0.0
  status: active
  statement: "A test marker that references a claim id not declared in intent.yaml is reported as an orphan."
  rationale: "Markers drift from the spec; orphan detection catches references to renamed or removed claims."
  test:
    scope: unit
    component: Auditor
    type: behavior
  criticality: high

INT-CSD-003:
  version: 1.0.0
  status: active
  statement: "Active claims with no attesting test are reported as unattested; draft and deprecated claims are exempt."
  rationale: "Coverage is the point of the tool; draft is pre-implementation and deprecated expects no test."
  test:
    scope: unit
    component: Auditor
    type: behavior
  criticality: high

INT-CSD-004:
  version: 1.0.0
  status: active
  statement: "Attestations are collected across runtimes: Python via AST (@intent on test_* functions) and JS/TS via the intent() call in *.test.* and *.spec.* files."
  rationale: "CSD intent is cross-runtime; one auditor must see pytest, vitest, and Playwright in a single pass."
  test:
    scope: unit
    component: Walker
    type: behavior
  criticality: high

INT-CSD-005:
  version: 1.0.0
  status: active
  statement: "The --fail-on policy (schema | orphan | unattested | any | none) selects which violation kinds set a non-zero exit code."
  rationale: "CI needs to choose how strict the gate is without parsing the tool's output."
  test:
    scope: integration
    component: CLI
    type: contract
  criticality: high

INT-CSD-006:
  version: 1.0.0
  status: active
  statement: "Relative --intent and --tests-dir paths are anchored to PROJECT_DIR, so an audit yields the same result from any working directory."
  rationale: "CI and skills invoke the CLI from repo roots; cwd-relative resolution scans the wrong tree and reports false unattested claims."
  test:
    scope: integration
    component: CLI
    type: contract
  criticality: high

INT-CSD-007:
  version: 1.0.0
  status: active
  statement: "An intent.yaml that parses to zero canonical INT-* claims is reported as a schema violation, not a clean audit."
  rationale: "A file present with nothing the parser recognises is schema drift, not an empty-but-valid project; a silent CLEAN masks it from the gate that is supposed to catch it (issue #5)."
  test:
    scope: unit
    component: Auditor
    type: behavior
  criticality: high

INT-CSD-008:
  version: 1.0.0
  status: active
  statement: "A repeated key in intent.yaml is refused at parse time and reported as a schema violation, never resolved last-wins."
  rationale: "YAML drops the earlier claim silently, so a duplicate id un-enforces one claim and re-points its markers at the survivor while the audit still prints CLEAN (issue #12)."
  test:
    scope: unit
    component: SchemaValidator
    type: invariant
  criticality: critical

INT-CSD-009:
  version: 1.0.0
  status: active
  statement: "A claim binding at `llm` scope is accepted by the schema and is never reported unattested for want of a marker, because a reviewer's recorded verdict attests it rather than a test run."
  rationale: "CSD-INTENT-01 section 3.3's judged scope. A claim about meaning - whether a statement is falsifiable, whether a message explains its failure - cannot be decided by a runner, and a mechanical test that approximates the answer is a green that means nothing. The auditor must therefore accept the scope and stop asking for a marker that does not exist, or every judged claim reads as a coverage gap."
  test:
    scope: unit
    component: Auditor
    type: behavior
  criticality: high

INT-CSD-010:
  version: 1.0.0
  status: active
  statement: "A test marker on a claim bound at `llm` scope is reported as a violation rather than counted as attestation."
  rationale: "An `llm` claim is attested by a recorded reviewer verdict, so a marker means someone wrote a mechanical test to approximate a judgement no runner can make. Counting it as attestation makes that approximation invisible and green, which is the exact failure the scope exists to prevent."
  test:
    scope: unit
    component: Auditor
    type: invariant
  criticality: high
