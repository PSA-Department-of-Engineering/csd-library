[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csd-intent"
version = "0.5.0"
description = "Cross-runtime audit tool for CSD intent specifications. Validates intent.yaml against CSD-INTENT-01 and verifies each claim is attested by at least one test across pytest, vitest, Playwright, or any other runner using the standard intent() marker."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rafael Pires"},
]
keywords = ["csd", "intent", "testing", "specification", "audit", "cross-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
csd-intent = "csd_intent.cli:main"

[project.urls]
Homepage = "https://github.com/PSA-Department-of-Engineering/csd-library"
Documentation = "https://github.com/PSA-Department-of-Engineering/csd-library#readme"
"CSD methodology" = "https://github.com/PSA-Department-of-Engineering/cognitive-software-delivery"

[tool.setuptools.packages.find]
where = ["."]
include = ["csd_intent*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
csd_intent = ["py.typed"]
