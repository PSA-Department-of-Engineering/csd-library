target-version = "py310"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-length handled by formatter
]

[lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine
